# Unified Agent System — Single Compose for Local + Ubuntu 24.04 VPS
# Local Docker:  docker compose up -d
# VPS Prod:      docker compose --profile prod up -d
# Local + LLM:   docker compose --profile local-llm up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unified_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-unified_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unified_agent} -d ${POSTGRES_DB:-unified_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # SECURITY: Never expose DB port publicly

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # SECURITY: Never expose Redis port publicly

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unified_agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-unified_agent}
      REDIS_URL: redis://redis:6379/0
      APP_HOST: 0.0.0.0
      API_PORT: 8000
      DATA_DIR: /app/data
      BROWSER_WORKER_URL: http://browser-worker:7080
    volumes:
      - ./config:/app/config:ro
      - app_data:/app/data
      - browser_profiles:/app/browser_profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.worker_celery.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unified_agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-unified_agent}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      BROWSER_WORKER_URL: http://browser-worker:7080
    volumes:
      - ./config:/app/config:ro
      - app_data:/app/data
      - browser_profiles:/app/browser_profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler_main"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unified_agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-unified_agent}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
    volumes:
      - ./config:/app/config:ro
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  browser-worker:
    build:
      context: ./browser-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-manual}
      CAPTCHA_MAX_SPEND_USD: ${CAPTCHA_MAX_SPEND_USD:-0}
      PROFILES_DIR: /home/browser/profiles
      BIND_HOST: 0.0.0.0
      CONTROL_PORT: 7080
    shm_size: "1gb"
    ports:
      # SECURITY (F2): noVNC is bound strictly to localhost; access via SSH tunnel only.
      - "127.0.0.1:6080:6080"
    expose:
      - "7080"
    volumes:
      - browser_profiles:/home/browser/profiles
      - ./config:/app/config:ro
    depends_on:
      - redis
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: /api
      BACKEND_INTERNAL_URL: http://api:8000
      PORT: 3000
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unified_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-unified_agent}
      BACKUP_ENC_KEY: ${BACKUP_ENC_KEY:?BACKUP_ENC_KEY is required}
      PGHOST: postgres
    volumes:
      - ./backups:/backups
      - app_data:/app/data:ro
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  app_data:
  browser_profiles:
  caddy_data:
  caddy_config:
  ollama_data:
